<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planeta Holográfico 3D — C7Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #050015 0%, #000 100%);
    font-family: 'Outfit', sans-serif;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 20px 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
  }

  #title-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #title-block h1 {
    font-size: clamp(0.9rem, 2.5vw, 1.3rem);
    font-weight: 600;
    color: rgba(0, 255, 255, 0.85);
    text-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(0, 255, 255, 0.2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #title-block p {
    font-size: clamp(0.65rem, 1.5vw, 0.78rem);
    color: rgba(180, 100, 255, 0.6);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
  }

  #palette-panel {
    position: fixed;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: all;
  }

  .palette-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    cursor: pointer;
    transition: transform 0.2s, border-color 0.3s, box-shadow 0.3s;
    position: relative;
  }

  .palette-btn:hover,
  .palette-btn.active {
    transform: scale(1.25);
    border-color: rgba(255,255,255,0.7);
    box-shadow: 0 0 16px currentColor;
  }

  .palette-btn[data-name="cyber"]   { background: linear-gradient(135deg, #00ffff, #ff0080); color: #00ffff; }
  .palette-btn[data-name="fire"]    { background: linear-gradient(135deg, #ff4000, #ffcc00); color: #ff4000; }
  .palette-btn[data-name="nature"]  { background: linear-gradient(135deg, #00ff40, #0080ff); color: #00ff40; }
  .palette-btn[data-name="violet"]  { background: linear-gradient(135deg, #8000ff, #ff66cc); color: #8000ff; }
  .palette-btn[data-name="gold"]    { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #ffd700; }

  .palette-btn::after {
    content: attr(data-label);
    position: absolute;
    right: 46px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    letter-spacing: 0.05em;
  }

  .palette-btn:hover::after { opacity: 1; }

  #speed-panel {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50px;
    padding: 8px 20px;
    backdrop-filter: blur(10px);
    pointer-events: all;
  }

  #speed-panel label {
    font-size: 0.72rem;
    color: rgba(0, 255, 255, 0.6);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #speed-slider {
    -webkit-appearance: none;
    width: 100px;
    height: 3px;
    border-radius: 2px;
    background: rgba(0, 255, 255, 0.25);
    outline: none;
    cursor: pointer;
  }

  #speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #00ffff;
    box-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
    cursor: pointer;
  }

  #instructions {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
  }

  #footer-brand {
    position: fixed;
    bottom: 10px;
    right: 16px;
    z-index: 50;
    font-size: 0.68rem;
    color: rgba(0, 255, 255, 0.2);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
  }

  #music-btn {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 99;
    background: rgba(5, 0, 21, 0.85);
    border: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 50px;
    padding: 8px 16px;
    font-size: 0.85em;
    color: #00ffff;
    cursor: pointer;
    transition: border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(8px);
  }

  #music-btn:hover {
    border-color: #00ffff;
    box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.8s;
  }

  #loading-text {
    font-size: 0.85rem;
    color: rgba(0, 255, 255, 0.6);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }

  .loading-bar-wrap {
    width: 200px;
    height: 2px;
    background: rgba(0, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .loading-bar {
    height: 100%;
    background: linear-gradient(90deg, #00ffff, #ff0080);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="loading">
  <p id="loading-text">Cargando Universo Holográfico...</p>
  <div class="loading-bar-wrap">
    <div class="loading-bar" id="loading-bar"></div>
  </div>
</div>

<div id="hud">
  <div id="title-block">
    <h1>Planeta Holográfico 3D</h1>
    <p>Cosmos & Anillos de Partículas · Three.js</p>
  </div>
</div>

<div id="palette-panel">
  <button class="palette-btn active" data-name="cyber"  data-label="Nebulosa Cyber" title="Cyber Neon"></button>
  <button class="palette-btn"        data-name="fire"   data-label="Sol / Fuego" title="Fuego"></button>
  <button class="palette-btn"        data-name="nature" data-label="Planeta Vivo" title="Natural"></button>
  <button class="palette-btn"        data-name="violet" data-label="Agujero de Gusano" title="Galaxia"></button>
  <button class="palette-btn"        data-name="gold"   data-label="Estrella Dorada" title="Dorado"></button>
</div>

<div id="speed-panel">
  <label>Órbita</label>
  <input type="range" id="speed-slider" min="0" max="100" value="30">
</div>

<p id="instructions">Arrastra para explorar el espacio · Scroll para zoom</p>
<div id="footer-brand">C7Dev</div>

<audio id="bg-music" preload="auto" loop>
  <source src="https://raw.githubusercontent.com/Cristian14og/assets/main/book_of_life-romantic-saxophone-244539.mp3" type="audio/mpeg">
</audio>
<button id="music-btn">🎵 Activar Música</button>

<script>
const audio = document.getElementById('bg-music');
const musicBtn = document.getElementById('music-btn');

function toggleAudio() {
  if (audio.paused) {
    audio.play().then(() => {
      musicBtn.textContent = '🔊 Música';
    }).catch(err => console.log('Audio error:', err));
  } else {
    audio.pause();
    musicBtn.textContent = '🔈 Música';
  }
}

document.addEventListener('click', function startAudioOnFirstClick() {
  if (audio.paused) {
    audio.volume = 0.6;
    audio.play().then(() => {
      musicBtn.textContent = '🔊 Música';
    }).catch(() => {});
  }
}, { once: true });

musicBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  toggleAudio();
});
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';

const PALETTES = {
  cyber:  [0x00ffff, 0xff0080, 0x8000ff, 0x00ff80, 0xff4000, 0x4080ff],
  fire:   [0xff4000, 0xff8c00, 0xffcc00, 0xff2060, 0xff6000, 0xffa040],
  nature: [0x00ff40, 0x0080ff, 0x00ffcc, 0x40ff00, 0x0040ff, 0x80ff40],
  violet: [0x8000ff, 0xff66cc, 0xcc00ff, 0x6600cc, 0xff00cc, 0x9900ff],
  gold:   [0xffd700, 0xff8c00, 0xffaa00, 0xffc200, 0xff6600, 0xffe066],
};

let rotationSpeed = 0.005;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.015);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.5;
controls.minDistance = 4;
controls.maxDistance = 35;

scene.add(new THREE.AmbientLight(0x050015, 1));
const dl1 = new THREE.DirectionalLight(0xff66cc, 0.5);
dl1.position.set(5, 10, 7.5);
scene.add(dl1);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5, 0.6, 0.85
);
bloom.threshold = 0.05;
bloom.strength  = 1.6;
bloom.radius    = 0.9;
composer.addPass(bloom);
composer.addPass(new FilmPass(0.25, 0.2, 1024, false));

const rgbShift = new ShaderPass(RGBShiftShader);
rgbShift.uniforms['amount'].value = 0.002;
composer.addPass(rgbShift);

const loadingBar = document.getElementById('loading-bar');
loadingBar.style.width = '40%';

const planetGroup = new THREE.Group();
scene.add(planetGroup);

const sphereGeo = new THREE.SphereGeometry(3.5, 64, 64);
const planetPos = sphereGeo.attributes.position.array;
const planetCount = planetPos.length / 3;

const planetGeom = new THREE.BufferGeometry();
planetGeom.setAttribute('position', new THREE.Float32BufferAttribute(planetPos, 3));

const colArr = new Float32Array(planetCount * 3);
const origCols = [];
const twinkle  = [];

function buildColors(paletteName) {
  const palette = PALETTES[paletteName].map(h => new THREE.Color(h));
  for (let i = 0; i < planetCount; i++) {
    const t = i / (planetCount - 1);
    const ci = t * (palette.length - 1);
    const c1 = palette[Math.floor(ci)];
    const c2 = palette[Math.min(Math.ceil(ci), palette.length - 1)];
    const col = new THREE.Color().lerpColors(c1, c2, ci % 1);
    col.multiplyScalar(1.3);
    colArr.set([col.r, col.g, col.b], i * 3);
    origCols[i] = col.clone();
  }
}

buildColors('cyber');

for (let i = 0; i < planetCount; i++) {
  twinkle.push(Math.random() < 0.5 ? Math.random() * 6 + 3 : 0);
}

planetGeom.setAttribute('color', new THREE.Float32BufferAttribute(colArr, 3));

const planetMat = new THREE.PointsMaterial({
  size: 0.035,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const planetParticles = new THREE.Points(planetGeom, planetMat);
planetParticles.userData = { origCols, twinkle };
planetGroup.add(planetParticles);

const ringCount = 4000;
const ringPos = new Float32Array(ringCount * 3);
const ringCols = new Float32Array(ringCount * 3);

for(let i=0; i<ringCount; i++) {
  const radius = 4.8 + Math.random() * 2.8;
  const angle = Math.random() * Math.PI * 2;
  ringPos[i*3] = Math.cos(angle) * radius;
  ringPos[i*3+1] = (Math.random() - 0.5) * 0.2;
  ringPos[i*3+2] = Math.sin(angle) * radius;

  const col = new THREE.Color().setHSL(0.5 + Math.random()*0.3, 0.9, 0.6);
  ringCols[i*3] = col.r;
  ringCols[i*3+1] = col.g;
  ringCols[i*3+2] = col.b;
}

const ringGeom = new THREE.BufferGeometry();
ringGeom.setAttribute('position', new THREE.Float32BufferAttribute(ringPos, 3));
ringGeom.setAttribute('color', new THREE.Float32BufferAttribute(ringCols, 3));

const ringMat = new THREE.PointsMaterial({
  size: 0.025,
  vertexColors: true,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending,
});
const rings = new THREE.Points(ringGeom, ringMat);
rings.rotation.x = 0.4;
rings.rotation.z = 0.2;
planetGroup.add(rings);

const starsCount = 2000;
const starsPos = new Float32Array(starsCount * 3);
for(let i=0; i<starsCount*3; i++) {
  starsPos[i] = (Math.random() - 0.5) * 120;
}
const starsGeom = new THREE.BufferGeometry();
starsGeom.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));
const starsMat = new THREE.PointsMaterial({ size: 0.05, color: 0xffffff, transparent: true, opacity: 0.5 });
const starField = new THREE.Points(starsGeom, starsMat);
scene.add(starField);

loadingBar.style.width = '100%';
setTimeout(() => {
  const loadingEl = document.getElementById('loading');
  loadingEl.style.opacity = '0';
  setTimeout(() => loadingEl.style.display = 'none', 800);
}, 400);

function applySparkle(sys, t) {
  const colors = sys.geometry.attributes.color;
  const { origCols, twinkle } = sys.userData;
  for (let i = 0; i < colors.count; i++) {
    if (twinkle[i] > 0) {
      const p = Math.pow(Math.abs(Math.sin(twinkle[i] * t + i * 0.1)), 10);
      const b = 1 + 5 * p;
      const oc = origCols[i];
      colors.setXYZ(i, oc.r * b, oc.g * b, oc.b * b);
    }
  }
  colors.needsUpdate = true;
}

function switchPalette(name) {
  const palette = PALETTES[name].map(h => new THREE.Color(h));
  for (let i = 0; i < planetCount; i++) {
    const t = i / (planetCount - 1);
    const ci = t * (palette.length - 1);
    const c1 = palette[Math.floor(ci)];
    const c2 = palette[Math.min(Math.ceil(ci), palette.length - 1)];
    const col = new THREE.Color().lerpColors(c1, c2, ci % 1);
    col.multiplyScalar(1.3);
    colArr.set([col.r, col.g, col.b], i * 3);
    origCols[i] = col.clone();
  }
  planetGeom.attributes.color.set(colArr);
  planetGeom.attributes.color.needsUpdate = true;
}

document.querySelectorAll('.palette-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    switchPalette(btn.dataset.name);
  });
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  rotationSpeed = (e.target.value / 100) * 0.025;
});

const clock = new THREE.Clock();
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  time += dt;

  planetParticles.rotation.y += rotationSpeed;
  rings.rotation.y += rotationSpeed * 1.5;
  starField.rotation.y += 0.0002;

  applySparkle(planetParticles, time);
  controls.update();
  composer.render();
}

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

animate();
</script>
</body>
</html>
