<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Tengo Ojos Para Ti — C7Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg: #0d0510;
    --rose: #c44585;
    --rose-light: #e870b0;
    --violet: #7b3fa0;
    --violet-light: #a86cd0;
    --deep: #1a0c24;
    --cream: #f5eaf8;
    --card-bg: rgba(20, 8, 32, 0.92);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 40%, #1a0830 0%, #0d0510 60%, #050208 100%);
    padding: 20px;
    position: relative;
    font-family: 'Crimson Pro', serif;
    transition: background 0.8s ease;
  }

  .love-word {
    position: fixed;
    top: -60px;
    font-size: clamp(0.8rem, 2.2vw, 1rem);
    font-weight: 600;
    pointer-events: none;
    z-index: 0;
    animation: fall linear infinite;
    white-space: nowrap;
    opacity: 0;
    text-shadow: 0 0 8px currentColor;
    font-family: 'Crimson Pro', serif;
    font-style: italic;
  }

  @keyframes fall {
    0%   { transform: translateY(0) rotate(-5deg); opacity: 0; }
    8%   { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(115vh) rotate(5deg); opacity: 0; }
  }

  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    animation: drift linear infinite;
  }

  @keyframes drift {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    width: min(94vw, 640px);
    padding: 36px 28px 40px;
    background: var(--card-bg);
    border: 1px solid rgba(196, 69, 133, 0.35);
    border-radius: 24px;
    box-shadow:
      0 0 0 1px rgba(123, 63, 160, 0.2),
      0 0 40px rgba(196, 69, 133, 0.15),
      0 0 80px rgba(123, 63, 160, 0.08),
      0 20px 60px rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    transition: border-color 0.8s ease;
  }

  .container::before, .container::after {
    content: '✦';
    font-size: 1rem;
    color: rgba(196, 69, 133, 0.5);
    position: absolute;
    top: 14px;
    transition: color 0.8s;
  }
  .container::before { left: 18px; }
  .container::after  { right: 18px; }

  #mainPhoto {
    width: 65%;
    max-width: 260px;
    border-radius: 16px;
    border: 2px solid rgba(196, 69, 133, 0.5);
    display: block;
    margin: 0 auto 22px;
    transition: opacity 0.4s ease, border-color 0.8s ease;
    object-fit: cover;
    aspect-ratio: 1/1;
    box-shadow: 0 0 30px rgba(196, 69, 133, 0.3), 0 0 60px rgba(123, 63, 160, 0.2);
  }

  #step-indicator {
    font-size: 0.72rem;
    color: rgba(196, 69, 133, 0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-style: normal;
  }

  #mainText {
    font-size: clamp(1.05rem, 3.5vw, 1.3rem);
    line-height: 1.8;
    margin: 0 0 26px;
    color: var(--cream);
    font-weight: 400;
    font-style: italic;
    transition: opacity 0.4s ease;
    padding: 0 4px;
  }

  #mainText strong {
    color: var(--rose-light);
    font-style: normal;
    font-weight: 600;
  }

  #mainBtn {
    padding: 13px 28px;
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    font-family: 'Crimson Pro', serif;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, var(--rose) 0%, var(--violet) 100%);
    color: white;
    border: none;
    border-radius: 50px;
    box-shadow: 0 4px 20px rgba(196, 69, 133, 0.4), 0 0 40px rgba(123, 63, 160, 0.2);
    transition: transform 0.2s, box-shadow 0.3s, background 0.5s;
    max-width: min(88vw, 420px);
    white-space: normal;
    word-break: break-word;
    line-height: 1.4;
  }

  #mainBtn:hover  { transform: scale(1.04); box-shadow: 0 6px 28px rgba(196, 69, 133, 0.55); }
  #mainBtn:active { transform: scale(0.97); }

  #finalMsg {
    display: none;
    font-size: clamp(1rem, 3.5vw, 1.25rem);
    font-weight: 400;
    font-style: italic;
    line-height: 1.8;
    padding: 10px 4px;
    color: var(--cream);
    animation: fadeUp 0.8s ease;
  }

  #finalMsg strong {
    color: var(--rose-light);
    font-style: normal;
  }

  #final-signature {
    margin-top: 20px;
    font-family: 'Dancing Script', cursive;
    font-size: 1.8rem;
    color: var(--rose);
    text-shadow: 0 0 20px rgba(196, 69, 133, 0.4);
    display: none;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fade { opacity: 0 !important; }

  #footer-brand {
    position: fixed;
    bottom: 10px;
    right: 14px;
    z-index: 50;
    font-family: 'Crimson Pro', serif;
    font-size: 0.7rem;
    color: rgba(196, 69, 133, 0.3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
  }

  #music-btn {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 99;
    background: rgba(20, 8, 32, 0.85);
    border: 1px solid rgba(196, 69, 133, 0.35);
    border-radius: 50px;
    padding: 8px 16px;
    font-size: 0.85em;
    color: var(--rose-light);
    cursor: pointer;
    font-family: 'Crimson Pro', serif;
    transition: border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(8px);
  }

  #music-btn:hover {
    border-color: var(--rose);
    box-shadow: 0 0 12px rgba(196, 69, 133, 0.3);
  }
  </style>
</head>
<body>

  <div id="loveRain"></div>

  <div class="container" id="card">
    <p id="step-indicator">Paso 1 de 10</p>

    <img id="mainPhoto"
         src="https://i.postimg.cc/tgtsH6sT/mr-incredible-elastigirl-f816b1cd.webp"
         alt="imagen de amor">

    <p id="mainText">
      💜 Amorcita, necesito que sepas algo muy importante…<br>
      No hay otra. No habrá otra.<br>
      No tengo ojos para nadie más.<br>
      <strong>Solo te veo a ti, hoy y siempre.</strong> 💜
    </p>

    <p id="finalMsg"></p>
    <p id="final-signature"></p>

    <button id="mainBtn">💜 Quiero sentirme segura 💜</button>
  </div>

  <div id="footer-brand">C7Dev</div>

  <audio id="music" preload="auto" loop>
    <source src="https://raw.githubusercontent.com/Cristian14og/assets/main/andriig-love-love-acoustic-music-576402.mp3" type="audio/mpeg">
  </audio>

  <button id="music-btn">🎵 Activar Música</button>

  <script>
  const music = document.getElementById('music');
  const musicBtn = document.getElementById('music-btn');

  function toggleAudio() {
    if (music.paused) {
      music.play().then(() => {
        musicBtn.textContent = '🔊 Música';
      }).catch(err => {
        console.log('Audio error:', err);
      });
    } else {
      music.pause();
      musicBtn.textContent = '🔈 Música';
    }
  }

  document.addEventListener('click', function startM() {
    if (music.paused) {
      music.volume = 0.6;
      music.play().then(() => {
        musicBtn.textContent = '🔊 Música';
      }).catch(() => {});
    }
  }, { once: true });

  musicBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleAudio();
  });

  const loveWords = [
    'Solo tú 💜','Te amo 🌸','Eres mía 💗','Mi amor ✨',
    'Te adoro 💜','Eres todo 🌟','Para siempre 💍',
    'Solo tú existes 💜','Mi corazón 🌸','Eres única ✨',
    'Nunca te soltaré 💗','Mi todo 💜','Siempre tú 🌸',
    'Te quiero tanto 💗','Eres mi calma ✨'
  ];
  const wordColors = ['#e870b0','#a86cd0','#c44585','#d896e8','#f0a0cc'];

  function createWord() {
    const span = document.createElement('span');
    span.className = 'love-word';
    span.textContent = loveWords[Math.floor(Math.random() * loveWords.length)];
    span.style.left  = (Math.random() * 94) + 'vw';
    span.style.color = wordColors[Math.floor(Math.random() * wordColors.length)];
    const dur = (Math.random() * 8 + 7).toFixed(1);
    const delay = (Math.random() * 3).toFixed(1);
    span.style.animationDuration = dur + 's';
    span.style.animationDelay   = delay + 's';
    document.getElementById('loveRain').appendChild(span);
    setTimeout(() => span.remove(), (parseFloat(dur) + parseFloat(delay) + 0.5) * 1000);
  }
  setInterval(createWord, 700);
  for (let i = 0; i < 12; i++) setTimeout(createWord, i * 200);

  function createParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = (Math.random() * 100) + 'vw';
    const colors = ['rgba(196,69,133,0.4)','rgba(123,63,160,0.4)','rgba(232,112,176,0.3)'];
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.boxShadow = `0 0 ${size * 2}px ${p.style.background}`;
    const dur = (10 + Math.random() * 15).toFixed(1);
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (Math.random() * 5).toFixed(1) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), (parseFloat(dur) + 5) * 1000);
  }
  for (let i = 0; i < 20; i++) setTimeout(createParticle, i * 300);
  setInterval(createParticle, 2000);

  const pasos = [
    {
      foto: 'https://i.postimg.cc/yxzB6Qtp/which-are-the-best-couples-in-cartoon-shows-v0-jqjbz719ckye1.webp',
      texto: '💛 Eres la única persona en la que pienso al despertar…<br>y la última antes de dormir.<br>No existe nadie más en mi mente.<br><strong>Solo tú, siempre tú.</strong> 💛',
      bg: 'radial-gradient(ellipse at 30% 40%, #1a1000 0%, #0d0a02 60%, #050300 100%)',
      borde: 'rgba(200, 160, 30, 0.4)',
      btn: 'linear-gradient(135deg, #b8900a 0%, #7a5500 100%)',
      btnTxt: '💛 Cuéntame más 💛'
    },
    {
      foto: 'https://i.postimg.cc/T3BsXyzX/which-are-the-best-couples-in-cartoon-shows-v0-r88vhjgnxjye1.webp',
      texto: '❤️ Cuando estoy contigo el mundo entero desaparece.<br>No veo a nadie más porque nadie más importa.<br><strong>Mi mirada solo te busca a ti.</strong> ❤️',
      bg: 'radial-gradient(ellipse at 30% 40%, #1a0808 0%, #0d0404 60%, #050000 100%)',
      borde: 'rgba(196, 60, 60, 0.4)',
      btn: 'linear-gradient(135deg, #c03030 0%, #7a0808 100%)',
      btnTxt: '❤️ Sigue... ❤️'
    },
    {
      foto: 'https://i.postimg.cc/zBF2Wx34/71J5GS2IUj-L.webp',
      texto: '💜 Nunca hubo nadie que me hiciera sentir lo que tú me haces sentir.<br>Y sé que después de ti, no habrá nadie más.<br><strong>Eres mi todo.</strong> 💜',
      bg: 'radial-gradient(ellipse at 30% 40%, #120820 0%, #0a0412 60%, #050208 100%)',
      borde: 'rgba(168, 100, 208, 0.4)',
      btn: 'linear-gradient(135deg, #8040c0 0%, #4a1080 100%)',
      btnTxt: '💜 Necesito más 💜'
    },
    {
      foto: 'https://i.postimg.cc/y6nr8pMW/which-are-the-best-couples-in-cartoon-shows-v0-oy0kurwrlkye1.webp',
      texto: '🌿 Te elijo a ti cada día.<br>No porque no haya otras personas,<br>sino porque ninguna es tú.<br><strong>Y tú eres exactamente lo que quiero.</strong> 🌿',
      bg: 'radial-gradient(ellipse at 30% 40%, #081208 0%, #040a04 60%, #010501 100%)',
      borde: 'rgba(70, 180, 70, 0.4)',
      btn: 'linear-gradient(135deg, #2a8a2a 0%, #0a4a0a 100%)',
      btnTxt: '🌿 Quiero escuchar más 🌿'
    },
    {
      foto: 'https://i.postimg.cc/s2pTdTPQ/d2992b182e05b88fe28fa44535148bee.webp',
      texto: '🧡 Mi corazón no tiene espacio para nadie más.<br>Está tan lleno de ti que no cabe ni una sola duda.<br><strong>Eres mi única y mi siempre.</strong> 🧡',
      bg: 'radial-gradient(ellipse at 30% 40%, #1a0e00 0%, #0d0800 60%, #050300 100%)',
      borde: 'rgba(200, 130, 40, 0.4)',
      btn: 'linear-gradient(135deg, #c06010 0%, #7a3000 100%)',
      btnTxt: '🧡 Más, por favor 🧡'
    },
    {
      foto: 'https://i.postimg.cc/MHrDbNwj/02-Marge-y-Homero.webp',
      texto: '💗 No tengo ojos para otra porque mis ojos solo saben verte a ti.<br>No tengo corazón para otra porque el mío ya tiene dueña:<br><strong>Tú.</strong> 💗',
      bg: 'radial-gradient(ellipse at 30% 40%, #1a0814 0%, #0d0408 60%, #050205 100%)',
      borde: 'rgba(220, 100, 160, 0.4)',
      btn: 'linear-gradient(135deg, #c44585 0%, #7b1a4a 100%)',
      btnTxt: '💗 Continúa... 💗'
    },
    {
      foto: 'https://i.postimg.cc/ZRwF42WK/who-are-some-of-your-favorite-cartoon-couples-v0-7a6rg9ahasge1.webp',
      texto: '🌊 Aunque pase el tiempo, aunque cambien las cosas,<br>mis sentimientos por ti no cambian.<br><strong>Ayer, hoy y siempre: solo tú.</strong> 🌊',
      bg: 'radial-gradient(ellipse at 30% 40%, #040e1a 0%, #02080d 60%, #010305 100%)',
      borde: 'rgba(60, 140, 200, 0.4)',
      btn: 'linear-gradient(135deg, #1070a8 0%, #043858 100%)',
      btnTxt: '🌊 Más palabras... 🌊'
    },
    {
      foto: 'https://i.postimg.cc/xjFy7rrh/a7115615e4650a15688ba8a7025d3c2e.webp',
      texto: '✨ Quiero que sepas que no hay duda, no hay incertidumbre.<br>Hay certeza absoluta:<br><strong>Te quiero a ti, solo a ti, siempre a ti.</strong> ✨',
      bg: 'radial-gradient(ellipse at 30% 40%, #0e0a1a 0%, #08060f 60%, #030205 100%)',
      borde: 'rgba(140, 120, 220, 0.4)',
      btn: 'linear-gradient(135deg, #5848b8 0%, #281868 100%)',
      btnTxt: '✨ Una más ✨'
    },
    {
      foto: 'https://i.postimg.cc/htVLffXw/ey99hdpueaapxyf-67cc07f7.webp',
      texto: '🌸 Eres mi calma, mi alegría, mi hogar.<br>Donde estés tú, ahí quiero estar yo.<br><strong>No existe lugar ni persona que me mueva de tu lado.</strong> 🌸',
      bg: 'radial-gradient(ellipse at 30% 40%, #1a0816 0%, #0d0409 60%, #050205 100%)',
      borde: 'rgba(220, 120, 180, 0.4)',
      btn: 'linear-gradient(135deg, #c44585 0%, #781030 100%)',
      btnTxt: '🌸 Sigue... 🌸'
    },
    {
      foto: 'https://i.postimg.cc/tgtsH6sT/mr-incredible-elastigirl-f816b1cd.webp',
      texto: '💜 Y si todavía dudas, te lo repito mil veces más:<br>No hay otra. No habrá otra.<br>No quiero a otra.<br><strong>Solo te quiero a ti, ahora y para siempre.<br>Te amo.</strong> 💜',
      bg: 'radial-gradient(ellipse at 30% 40%, #0d0510 0%, #060209 60%, #020005 100%)',
      borde: 'rgba(196, 69, 133, 0.5)',
      btn: 'linear-gradient(135deg, #c44585 0%, #7b3fa0 100%)',
      btnTxt: '💜 Ya lo creo 💜',
      esFinal: true
    }
  ];

  let paso = 0;
  const mainPhoto  = document.getElementById('mainPhoto');
  const mainText   = document.getElementById('mainText');
  const mainBtn    = document.getElementById('mainBtn');
  const finalMsg   = document.getElementById('finalMsg');
  const finalSig   = document.getElementById('final-signature');
  const card       = document.getElementById('card');
  const stepIndicator = document.getElementById('step-indicator');

  mainBtn.addEventListener('click', () => {
    if (paso >= pasos.length) return;
    const p = pasos[paso];

    mainPhoto.classList.add('fade');
    mainText.classList.add('fade');

    setTimeout(() => {
      mainPhoto.src = p.foto;
      mainText.innerHTML = p.texto;
      document.body.style.background = p.bg;
      card.style.borderColor = p.borde;
      mainBtn.style.background = p.btn;
      mainBtn.innerHTML = p.btnTxt;

      mainPhoto.classList.remove('fade');
      mainText.classList.remove('fade');

      stepIndicator.textContent = paso < pasos.length - 1
        ? `Paso ${paso + 2} de ${pasos.length}`
        : 'Fin ❤️';

      if (p.esFinal) {
        mainBtn.style.display = 'none';
        stepIndicator.style.display = 'none';
        finalMsg.style.display = 'block';
        finalMsg.innerHTML =
          '🌸 ¡Gracias por creerme!<br>Cada palabra viene del fondo de mi corazón.<br><strong>Eres mi única, mi todo, mi amor para siempre.</strong> 🌸';
        setTimeout(() => {
          finalSig.style.display = 'block';
          finalSig.textContent = '— Con todo mi amor 💜';
        }, 1500);
      }
      paso++;
    }, 380);
  });
  </script>
</body>
</html>
